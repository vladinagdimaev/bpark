<!doctype html>
<html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>טיוטת ממשק — מעקב גן בנימין</title><style>
*{box-sizing:border-box}body{margin:0;background:#f5f7f1;color:#153c32;font:16px/1.6 Arial,sans-serif}main{max-width:850px;margin:auto;padding:24px}h1{font-size:2.2rem;margin-bottom:0}p{margin-top:4px}.notice{background:#fff3cd;border-right:4px solid #a66a00;padding:14px;margin:20px 0}.card,fieldset{background:#fff;border:1px solid #d6e1d6;border-radius:8px;padding:20px;margin:18px 0}legend{font-size:1.2rem;font-weight:bold;padding:0 8px}label{font-weight:bold;display:block;margin-top:14px}input,textarea,select{display:block;width:100%;margin-top:5px;padding:12px;font:inherit;border:1px solid #8ba393;border-radius:5px;background:white}textarea{min-height:84px;resize:vertical}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}button{padding:13px 24px;background:#153c32;color:white;border:0;border-radius:5px;font:inherit}button:disabled{opacity:.5}@media(max-width:600px){main{padding:16px}.grid{grid-template-columns:1fr}}
</style></head><body><main><p>גן בנימין / מעקב תושבים</p><h1>דו״ח סיור שבועי</h1><div class="notice"><strong>תצוגת פיתוח בלבד.</strong> הטופס עדיין אינו מחובר למסד הנתונים, והמידע והתמונות אינם נשמרים. אין למלא כאן דו״ח אמיתי.</div><form id="report-form"><section class="card"><h2>פרטי הסיור</h2><div class="grid"><label>תאריך ושעת הסיור<input type="datetime-local" name="visit_at"></label><label>משתתפים<input name="participants" autocomplete="off"></label></div><label>כותרת<input name="title"></label><label>סיכום הסיור<textarea name="summary"></textarea></label></section><div id="areas"></div><fieldset><legend>נושאים נוספים</legend><label>כניסות לגן<textarea name="entrances"></textarea></label><label>תחבורה ונגישות<textarea name="accessibility_transport"></textarea></label><label>תשתיות<textarea name="infrastructure"></textarea></label><label>מה נבדוק בשבוע הבא?<textarea name="next_visit_focus"></textarea></label></fieldset><button disabled type="submit">שמירה — עדיין לא מחוברת</button></form></main><script>
const names=['מתקני הכושר','בין צמרות','משחק לפעוטות','מצללת מטפסים','רחבת נורדאו','המעיין הפועם','אזור נדנדות','דק הפרלמנט','שביל נגיש','פרגולות הזית והחורשה','חצר כלבים'];const container=document.getElementById('areas');for (const [i,name] of names.entries()){const el=document.createElement('fieldset');el.innerHTML=`<legend>${i+1}. ${name}</legend><label>מצב<select name="area_${i+1}_status"><option value="not_checked">לא נבדק</option><option value="not_started">טרם החלו</option><option value="in_progress">בתהליך</option><option value="completed">הושלם</option><option value="other">אחר</option></select></label><label>מה השתנה מהביקור הקודם?<textarea name="area_${i+1}_change"></textarea></label><label>מה ראינו? (עובדה)<textarea name="area_${i+1}_observation"></textarea></label><label>התרשמות<textarea name="area_${i+1}_interpretation"></textarea></label><label>שאלה להמשך בירור<textarea name="area_${i+1}_question"></textarea></label><label>תמונות מהשטח<input type="file" name="area_${i+1}_photos" accept="image/*" multiple></label>`;container.append(el)}
document.getElementById('report-form').addEventListener('submit',e=>e.preventDefault());</script></body></html>
