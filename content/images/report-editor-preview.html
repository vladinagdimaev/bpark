<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>דו״ח סיור · גן בנימין</title><style>
*{box-sizing:border-box}body{margin:0;background:#f6f6ed;color:#192e26;font:17px/1.65 Arial,sans-serif}header{background:#183e32;color:white;padding:20px max(5vw,16px)}main{width:min(860px,92%);margin:32px auto 70px}h1{font-size:clamp(32px,6vw,52px);line-height:1.18;margin:12px 0}h2{margin-top:0}article,section{margin:20px 0;padding:clamp(16px,4vw,32px);background:#fff;border:1px solid #d6dfd3;border-radius:12px}label{display:block;margin:10px 0}input,textarea,select,button{font:inherit}input:not([type=file]),textarea,select{background:white;color:inherit;width:100%;padding:9px;border:1px solid #81998b;border-radius:6px}textarea{resize:vertical;min-height:80px}button{background:#183e32;color:white;padding:9px 15px;border:1px solid #183e32;border-radius:6px;cursor:pointer}button.secondary{background:white;color:#183e32}button:disabled{opacity:.55}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid #b96d16;outline-offset:3px}.bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.pair{margin:14px 0}.photo{min-width:0;background:#edf2e7;border-radius:8px;padding:12px}.photo p{margin:0}figure{margin:0}.media{aspect-ratio:4/3;background:#dfe9d7;display:grid;place-items:center;text-align:center;padding:8px;margin:6px 0}.media:has(img){padding:0}.media img{display:block;width:100%;height:100%;object-fit:contain}.photo input{max-width:100%}details{margin:14px 0}summary{cursor:pointer}#status{min-height:1.6em;color:#354f3d}p{overflow-wrap:anywhere;white-space:pre-wrap}@media(max-width:600px){.grid{grid-template-columns:1fr}}
</style></head><body><header>גן בנימין · מעקב תושבים</header><main>
<small>גרסה להתנסות · הטיוטה נשמרת בדפדפן הזה</small>
<h1>דו״ח סיור בגן בנימין</h1>
<div class="bar"><button id="mode" type="button" class="secondary">תצוגת קריאה</button><button id="save" type="button">שמירת טיוטה</button></div><p id="status" role="status"></p>
<div id="report"></div>
</main><script>
const names=['מתקני הכושר','בין צמרות','משחק לפעוטות','מצללת מטפסים','רחבת נורדאו','המעיין הפועם','אזור נדנדות','דק הפרלמנט','שביל נגיש','פרגולות הזית והחורשה','חצר כלבים'];
const statuses=['טרם החלו','בתהליך','הושלם','נבדק, ללא שינוי'];
const checks=['המעבר פנוי','קיימת גישה רציפה','קיים מעבר נוח לכיסא גלגלים'];
const users=['ולדי','אריאל'];
const key='bpark-inline-report-preview-v1';
const get=id=>document.getElementById(id);
const escape=value=>String(value??'').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
const options=(items,current,placeholder)=>'<option value="">'+escape(placeholder)+'</option>'+items.map(item=>'<option'+(current===item?' selected':'')+'>'+escape(item)+'</option>').join('');
const localNow=new Date(Date.now()-new Date().getTimezoneOffset()*60000).toISOString().slice(0,16);
let draft={visit:localNow,lead:'',next:'',first:'',second:'',areas:{}};
try{const saved=localStorage.getItem(key);if(saved)draft=JSON.parse(saved)}catch{}
let edit=true, uploads=0;
function save(){try{localStorage.setItem(key,JSON.stringify(draft));get('status').textContent='הטיוטה נשמרה בדפדפן.'}catch{get('status').textContent='השמירה נכשלה. ייתכן שאין מקום פנוי בדפדפן.'}}
function areaMarkup(id,area){
 const name=names[id];const photo=/^data:image\/jpeg;base64,[A-Za-z0-9+/=]+$/.test(area.photo||'')?area.photo:'';
 return '<article id="area-'+id+'" data-area="'+id+'"><h2>'+escape(name)+'</h2>'+
 '<div class="grid pair"><figure class="photo"><figcaption>תוכנית העירייה</figcaption><div class="media">מקום לתוכנית הקבועה של '+escape(name)+'</div></figure>'+
 '<figure class="photo"><figcaption>צילום מהשטח</figcaption><div class="media" data-photo>'+ (photo?'<img src="'+photo+'" alt="צילום מהשטח — '+escape(name)+'">':'טרם צורף צילום')+'</div>'+
 (edit?'<div class="bar"><button type="button" data-camera-button>צלמו עכשיו</button><input type="file" accept="image/*" capture="environment" data-camera data-upload hidden><button type="button" class="secondary" data-gallery-button>בחירה מהגלריה</button><input type="file" accept="image/*" data-gallery data-upload hidden></div>':'')+'</figure></div>'+
 (edit?'<details><summary>הדיווח הקודם על האזור</summary><p>כאן יוצג הדיווח האחרון על האזור לאחר החיבור לנתוני האתר.</p></details>'+
 '<label>סטטוס עבודה<select data-value="status">'+options(statuses,area.status,'בחירת סטטוס')+'</select></label>'+
 '<label>מה ראינו?<textarea data-value="text">'+escape(area.text)+'</textarea></label>'+
 '<label>נקודות למעקב<textarea data-value="follow">'+escape(area.follow)+'</textarea></label>'+
 '<details><summary>שאלות נגישות לדוגמה</summary>'+checks.map((check,i)=>'<label>'+escape(check)+'<select data-value="check'+i+'">'+options(['קיים','לא קיים','לא נבדק','לא רלוונטי'],area['check'+i],'בחירת תשובה')+'</select></label><label>הערה על '+escape(check)+'<input data-value="note'+i+'" value="'+escape(area['note'+i])+'"></label>').join('')+
 '</details><button type="button" class="secondary" data-remove>הסרת אזור מהטיוטה</button>':
 (area.status?'<p><strong>'+escape(area.status)+'</strong></p>':'')+(area.text?'<p>'+escape(area.text)+'</p>':'')+(area.follow?'<p>למעקב · '+escape(area.follow)+'</p>':'')+
 checks.map((check,i)=>area['check'+i]?'<p>'+escape(check)+' · '+escape(area['check'+i])+(area['note'+i]?' · '+escape(area['note'+i]):'')+'</p>':'').join(''))+'</article>';
}
function render(){
 get('mode').textContent=edit?'תצוגת קריאה':'חזרה לעריכה';
 const areas=Object.entries(draft.areas).map(([id,a])=>areaMarkup(id,a)).join('');
 const remaining=names.map((name,id)=>({name,id})).filter(({id})=>!Object.hasOwn(draft.areas,id));
 const date=new Date(draft.visit);
 get('report').innerHTML=(edit?
 '<section><div class="grid"><label>מתעד ראשון<select data-report="first">'+options(users,draft.first,'בחירת מתעד')+'</select></label><label>מתעד שני<select data-report="second">'+options(users,draft.second,'בחירת מתעד')+'</select></label></div><label>מועד הסיור<input type="datetime-local" data-report="visit" value="'+escape(draft.visit)+'"></label><label>פתיח לציבור<textarea data-report="lead" placeholder="מה ראינו בסיור?">'+escape(draft.lead)+'</textarea></label></section>':
 '<section>'+(!Number.isNaN(+date)?'<time>'+escape(date.toLocaleString('he-IL'))+'</time>':'')+'<p>'+escape([draft.first,draft.second].filter(Boolean).join(' ו'))+'</p><p>'+escape(draft.lead)+'</p></section>')+
 (areas||'<p>עדיין אין אזורים בדו״ח.</p>')+
 (edit&&remaining.length?'<section class="bar"><label>אזור מהסיור<select id="choose"><option value="">בחירת אזור</option>'+remaining.map(({name,id})=>'<option value="'+id+'">'+escape(name)+'</option>').join('')+'</select></label><button id="add" type="button">הוספת אזור</button></section>':'')+
 (edit?'<section><label>מועד לביקור הבא<input type="date" data-report="next" value="'+escape(draft.next)+'"></label></section>':(draft.next?'<section>הביקור הבא · '+escape(draft.next.split('-').reverse().join('.'))+'</section>':''));
}
get('report').addEventListener('input',event=>{
 const field=event.target;
 if(field.dataset.report)draft[field.dataset.report]=field.value;
 if(field.dataset.value)draft.areas[field.closest('[data-area]').dataset.area][field.dataset.value]=field.value;
});
get('report').addEventListener('click',event=>{
 const target=event.target;
 if(target.hasAttribute('data-camera-button'))target.closest('figure').querySelector('[data-camera]').click();
 if(target.hasAttribute('data-gallery-button'))target.closest('figure').querySelector('[data-gallery]').click();
 if(target.id==='add'){
  const chosen=get('choose').value;
  if(chosen===''||Object.hasOwn(draft.areas,chosen))return;
  draft.areas[chosen]={};render();get('area-'+chosen).scrollIntoView();
 }
 if(target.hasAttribute('data-remove')&&confirm('להסיר את האזור מהטיוטה?')){
  delete draft.areas[target.closest('[data-area]').dataset.area];render();
 }
});
get('report').addEventListener('change',async event=>{
 const field=event.target;
 if(!field.hasAttribute('data-upload')||!field.files[0])return;
 const file=field.files[0];field.value='';
 const area=field.closest('[data-area]');
 const data=draft.areas[area.dataset.area];
 const source=URL.createObjectURL(file);uploads++;field.disabled=true;get('save').disabled=true;
 try{
  const img=new Image();img.src=source;await img.decode();
  const scale=Math.min(1,1000/Math.max(img.naturalWidth,img.naturalHeight));
  const canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(img.naturalWidth*scale));canvas.height=Math.max(1,Math.round(img.naturalHeight*scale));
  canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);
  if(draft.areas[area.dataset.area]===data){data.photo=canvas.toDataURL('image/jpeg',.72);const preview=get(area.id)?.querySelector('[data-photo]');if(preview){const thumb=new Image();thumb.src=data.photo;thumb.alt='צילום מהשטח';preview.replaceChildren(thumb)}get('status').textContent='הצילום צורף לטיוטה.'}
 }catch{get('status').textContent='לא הצלחנו לפתוח את התמונה. נסו תמונה אחרת.'}finally{URL.revokeObjectURL(source);field.disabled=false;uploads--;get('save').disabled=uploads>0}
});
get('save').onclick=save;
get('mode').onclick=()=>{edit=!edit;render()};
render();
</script></body></html>
